<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="title desc">
  <title id="title">Smith 圆图读图路线</title>
  <desc id="desc">Smith 圆图在反射系数平面上表示归一化阻抗，匹配点在圆心，沿无耗线移动就是沿等反射系数模长圆旋转。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M1 1 L9 5.5 L1 10 Z" fill="#d86b22"/>
    </marker>
    <style>
      .bg{fill:#f8fbff}
      .circle{fill:#fff;stroke:#21313c;stroke-width:3}
      .grid{fill:none;stroke:#b8c8d6;stroke-width:1.6}
      .grid2{fill:none;stroke:#d5e0e8;stroke-width:1.2}
      .path{fill:none;stroke:#d86b22;stroke-width:5;stroke-linecap:round;marker-end:url(#arrow)}
      .vswr{fill:none;stroke:#2f7d62;stroke-width:4}
      .axis{stroke:#8da0af;stroke-width:2}
      .label{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1f2d36;font-size:24px;font-weight:700}
      .small{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#435666;font-size:17px}
      .math{font-family:"Times New Roman","Noto Serif SC",serif;fill:#263d4a;font-size:24px;font-style:italic}
      .dot{fill:#d86b22;stroke:#fff;stroke-width:3}
    </style>
  </defs>
  <rect width="980" height="640" rx="18" class="bg"/>
  <text x="56" y="70" class="label">Smith 圆图：先看 Γ，再读归一化阻抗</text>
  <text x="56" y="104" class="small">单位圆内是无源负载；圆心匹配，外圆全反射。</text>

  <g transform="translate(355 342)">
    <circle r="205" class="circle"/>
    <line x1="-205" y1="0" x2="205" y2="0" class="axis"/>
    <line x1="0" y1="-205" x2="0" y2="205" class="axis" opacity=".4"/>
    <circle cx="78" cy="0" r="127" class="grid"/>
    <circle cx="136" cy="0" r="69" class="grid"/>
    <circle cx="-68" cy="0" r="137" class="grid2"/>
    <path d="M-203 0 C-95 -120 86 -128 205 0" class="grid"/>
    <path d="M-203 0 C-95 120 86 128 205 0" class="grid"/>
    <path d="M-190 -78 C-70 -48 60 -52 190 -126" class="grid2"/>
    <path d="M-190 78 C-70 48 60 52 190 126" class="grid2"/>
    <circle r="126" class="vswr"/>
    <path d="M68 106 A126 126 0 0 0 136 -54" class="path"/>
    <circle cx="0" cy="0" r="8" fill="#246b4f"/>
    <circle cx="68" cy="106" r="9" class="dot"/>
    <circle cx="136" cy="-54" r="9" class="dot"/>
    <text x="-230" y="8" class="small">短路</text>
    <text x="214" y="8" class="small">开路</text>
    <text x="14" y="-14" class="small">匹配</text>
    <text x="62" y="142" class="small">负载点</text>
    <text x="148" y="-66" class="small">向源移动后</text>
  </g>

  <rect x="620" y="168" width="300" height="310" rx="16" fill="#fff" stroke="#d7e2eb" stroke-width="2"/>
  <text x="648" y="214" class="label" font-size="22">读图顺序</text>
  <text x="648" y="258" class="small">1. 先把 Z 归一化成 z̄</text>
  <text x="648" y="294" class="small">2. 找到对应 Γ 点</text>
  <text x="648" y="330" class="small">3. 沿等 |Γ| 圆旋转</text>
  <text x="648" y="366" class="small">4. 回读 z̄ 或 ȳ</text>
  <text x="648" y="418" class="math">z̄ = (1 + Γ)/(1 − Γ)</text>
  <text x="648" y="454" class="math">ρ = (1 + |Γ|)/(1 − |Γ|)</text>
  <text x="90" y="588" class="small">向源移动：本讲义按顺时针读；移动 l 时 Γ 相位转 2βl。</text>
</svg>
