<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="580" viewBox="0 0 1020 580" role="img" aria-labelledby="title desc">
  <title id="title">色散、相速与群速</title>
  <desc id="desc">在波导中 beta 对 omega 的关系是弯曲曲线，相速来自原点连线，群速来自切线斜率；不同频率分量速度不同会使脉冲展宽。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#263641"/>
    </marker>
    <marker id="arrB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1769aa"/>
    </marker>
    <style>
      .bg{fill:#f7fbff}
      .panel{fill:#fff;stroke:#d8e2e8;stroke-width:2}
      .axis{stroke:#263641;stroke-width:3;marker-end:url(#arrow)}
      .curve{fill:none;stroke:#d86b22;stroke-width:5;stroke-linecap:round}
      .lineB{stroke:#1769aa;stroke-width:4;marker-end:url(#arrB)}
      .tan{stroke:#2f7d62;stroke-width:4}
      .grid{stroke:#dce6ed;stroke-width:1.5}
      .pulse{fill:none;stroke:#1769aa;stroke-width:4}
      .pulse2{fill:none;stroke:#d86b22;stroke-width:4}
      .label{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1f2d36;font-size:24px;font-weight:700}
      .small{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#435666;font-size:17px}
      .math{font-family:"Times New Roman","Noto Serif SC",serif;fill:#263d4a;font-size:23px;font-style:italic}
    </style>
  </defs>
  <rect width="1020" height="580" rx="18" class="bg"/>
  <text x="52" y="70" class="label">波导色散：β(ω) 不是一条直线</text>

  <rect x="52" y="112" width="560" height="388" rx="16" class="panel"/>
  <line x1="116" y1="438" x2="548" y2="438" class="axis"/>
  <line x1="116" y1="438" x2="116" y2="154" class="axis"/>
  <text x="548" y="468" class="math">β</text>
  <text x="82" y="162" class="math">ω</text>
  <line x1="116" y1="388" x2="548" y2="388" class="grid"/>
  <line x1="116" y1="318" x2="548" y2="318" class="grid"/>
  <line x1="116" y1="248" x2="548" y2="248" class="grid"/>
  <path d="M162 430 C210 360 260 300 322 256 C384 214 450 190 524 174" class="curve"/>
  <line x1="116" y1="438" x2="382" y2="218" class="lineB"/>
  <line x1="268" y1="296" x2="498" y2="184" class="tan"/>
  <circle cx="382" cy="218" r="7" fill="#d86b22" stroke="#fff" stroke-width="3"/>
  <text x="180" y="272" class="small" fill="#1769aa">相速：ω/β</text>
  <text x="408" y="198" class="small" fill="#2f7d62">群速：dω/dβ</text>
  <text x="152" y="476" class="math">β = √(ω²/c² − kc²)</text>

  <rect x="650" y="112" width="318" height="388" rx="16" class="panel"/>
  <text x="680" y="154" class="label" font-size="21">脉冲为什么会展宽</text>
  <path d="M694 250 C720 188 746 188 772 250 C798 312 824 312 850 250 C876 188 902 188 928 250" class="pulse"/>
  <path d="M694 362 C730 302 766 302 802 362 C838 422 874 422 928 362" class="pulse2"/>
  <text x="686" y="202" class="small">不同频率分量</text>
  <text x="686" y="396" class="small">传播后包络被拉宽</text>
  <text x="686" y="446" class="math">vp = ω/β</text>
  <text x="806" y="446" class="math">vg = dω/dβ</text>
  <text x="686" y="478" class="small">能量和窄带包络更关心群速</text>
</svg>
