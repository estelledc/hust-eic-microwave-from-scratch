<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">三种波长的分工</title>
  <desc id="desc">lambda0 描述无界介质中的工作波长，lambdac 描述模的截止门槛，lambdag 描述导行后沿波导轴向的相位周期。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1769aa"/>
    </marker>
    <style>
      .bg{fill:#fffdf7}
      .panel{fill:#fff;stroke:#d9e2e8;stroke-width:2}
      .wave0{fill:none;stroke:#1769aa;stroke-width:4}
      .waveg{fill:none;stroke:#d86b22;stroke-width:4}
      .gate{fill:#eef3f5;stroke:#263641;stroke-width:4}
      .ruler{stroke:#263641;stroke-width:3;marker-end:url(#arrow)}
      .tick{stroke:#263641;stroke-width:2}
      .label{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1f2d36;font-size:24px;font-weight:700}
      .small{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#435666;font-size:17px}
      .math{font-family:"Times New Roman","Noto Serif SC",serif;fill:#263d4a;font-size:24px;font-style:italic}
    </style>
  </defs>
  <rect width="1000" height="560" rx="18" class="bg"/>
  <text x="52" y="70" class="label">三个“波长”不是同一把尺子</text>

  <rect x="54" y="114" width="270" height="330" rx="16" class="panel"/>
  <text x="84" y="156" class="label" font-size="21">工作波长 λ0</text>
  <path d="M90 244 C120 200 150 288 180 244 C210 200 240 288 270 244" class="wave0"/>
  <line x1="90" y1="304" x2="180" y2="304" class="ruler"/>
  <line x1="90" y1="292" x2="90" y2="316" class="tick"/>
  <line x1="180" y1="292" x2="180" y2="316" class="tick"/>
  <text x="116" y="338" class="math">λ0 = c/f</text>
  <text x="84" y="392" class="small">由频率和填充介质决定</text>
  <text x="84" y="420" class="small">还没问波导轴向怎么走</text>

  <rect x="365" y="114" width="270" height="330" rx="16" class="panel"/>
  <text x="395" y="156" class="label" font-size="21">截止波长 λc</text>
  <rect x="430" y="218" width="140" height="92" rx="10" class="gate"/>
  <path d="M430 264 L570 264" stroke="#d86b22" stroke-width="4"/>
  <path d="M500 218 L500 310" stroke="#1769aa" stroke-width="4"/>
  <text x="420" y="342" class="math">λc = 2π/kc</text>
  <text x="395" y="392" class="small">某一几何和某一模的门槛</text>
  <text x="395" y="420" class="small">同一波导不同模有不同 λc</text>

  <rect x="676" y="114" width="270" height="330" rx="16" class="panel"/>
  <text x="706" y="156" class="label" font-size="21">波导波长 λg</text>
  <rect x="720" y="220" width="182" height="74" rx="9" class="gate"/>
  <path d="M734 257 C780 212 826 302 872 257" class="waveg"/>
  <line x1="734" y1="326" x2="872" y2="326" class="ruler"/>
  <line x1="734" y1="314" x2="734" y2="338" class="tick"/>
  <line x1="872" y1="314" x2="872" y2="338" class="tick"/>
  <text x="720" y="370" class="math">λg = 2π/β</text>
  <text x="706" y="404" class="small">导行后沿 z 的相位周期</text>
  <text x="706" y="432" class="small">波导段电长度要用它</text>

  <rect x="128" y="470" width="744" height="56" rx="14" fill="#eef6ff" stroke="#bed4e8" stroke-width="2"/>
  <text x="166" y="506" class="math">可导行时： λ &lt; λc，且 λg = λ0 / √(1 − (λ0/λc)²)（空气）</text>
</svg>
