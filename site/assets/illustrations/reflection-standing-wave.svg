<svg xmlns="http://www.w3.org/2000/svg" width="980" height="540" viewBox="0 0 980 540" role="img" aria-labelledby="title desc">
  <title id="title">负载不匹配导致反射和驻波</title>
  <desc id="desc">入射波到达负载后部分反射，沿线叠加形成电压包络的波腹和波节。</desc>
  <defs>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1769aa"/>
    </marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#df6b21"/>
    </marker>
    <style>
      .bg{fill:#fbfcf8}
      .box{fill:#fff;stroke:#d7e0e6;stroke-width:2}
      .line{stroke:#1f2d36;stroke-width:5;stroke-linecap:round}
      .inc{stroke:#1769aa;stroke-width:5;fill:none;marker-end:url(#blueArrow)}
      .ref{stroke:#df6b21;stroke-width:5;fill:none;marker-end:url(#orangeArrow)}
      .env{fill:none;stroke:#246b4f;stroke-width:4}
      .wave{fill:none;stroke:#607d8b;stroke-width:2;stroke-dasharray:6 8}
      .label{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1f2d36;font-size:24px;font-weight:700}
      .small{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#465a69;font-size:17px}
      .math{font-family:"Times New Roman","Noto Serif SC",serif;fill:#263d4a;font-size:25px;font-style:italic}
      .tag{fill:#eef6ff;stroke:#bfd6ea;stroke-width:1.5}
    </style>
  </defs>
  <rect width="980" height="540" rx="18" class="bg"/>
  <rect x="42" y="42" width="896" height="456" rx="16" class="box"/>
  <text x="70" y="88" class="label">负载不匹配：一部分波被“弹回来”</text>

  <line x1="110" y1="200" x2="820" y2="200" class="line"/>
  <rect x="820" y="155" width="70" height="90" rx="8" fill="#f6eadb" stroke="#b97d38" stroke-width="3"/>
  <text x="834" y="208" class="label" font-size="22">ZL</text>
  <text x="115" y="178" class="small">源端</text>
  <text x="826" y="145" class="small">终端负载</text>

  <path d="M150 165 C240 125 330 205 420 165 C510 125 600 205 690 165 C740 145 780 150 812 168" class="inc"/>
  <path d="M790 240 C700 280 610 200 520 240 C430 280 340 200 250 240 C210 258 176 252 146 236" class="ref"/>
  <text x="230" y="122" class="small" fill="#1769aa">入射波 U⁺</text>
  <text x="390" y="292" class="small" fill="#df6b21">反射波 U⁻</text>

  <rect x="72" y="316" width="350" height="116" rx="12" class="tag"/>
  <text x="96" y="354" class="math">ΓL = (ZL − Zc) / (ZL + Zc)</text>
  <text x="96" y="389" class="small">匹配：ΓL = 0，无反射</text>
  <text x="96" y="418" class="small">不匹配：0 &lt; |ΓL| ≤ 1，出现驻波</text>

  <text x="520" y="336" class="small">叠加后的电压幅值包络</text>
  <line x1="520" y1="420" x2="890" y2="420" stroke="#8fa3b5" stroke-width="2"/>
  <path d="M520 390 C565 336 610 336 655 390 C700 444 745 444 790 390 C825 348 860 352 890 388" class="env"/>
  <path d="M520 450 C565 504 610 504 655 450 C700 396 745 396 790 450 C825 492 860 488 890 452" class="env"/>
  <path d="M520 420 C565 366 610 474 655 420 C700 366 745 474 790 420 C825 378 860 462 890 420" class="wave"/>
  <text x="612" y="376" class="small">波腹</text>
  <text x="718" y="466" class="small">波节</text>
  <text x="532" y="484" class="math">ρ = (1 + |Γ|) / (1 − |Γ|)</text>
</svg>
