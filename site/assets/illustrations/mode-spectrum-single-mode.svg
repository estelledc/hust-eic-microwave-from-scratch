<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="560" viewBox="0 0 1020 560" role="img" aria-labelledby="title desc">
  <title id="title">矩形波导单模工作窗口</title>
  <desc id="desc">频率高于 TE10 截止而低于最近高次模截止时，只传 TE10 主模；再升高频率会进入多模区。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#263641"/>
    </marker>
    <style>
      .bg{fill:#f8fbff}
      .panel{fill:#fff;stroke:#d8e2e8;stroke-width:2}
      .axis{stroke:#263641;stroke-width:4;marker-end:url(#arrow)}
      .cut{stroke:#b93d3d;stroke-width:4}
      .zone1{fill:#fff0ed}
      .zone2{fill:#e8f6ee}
      .zone3{fill:#eef3ff}
      .mode{fill:#fff;stroke:#8fa3b5;stroke-width:2}
      .label{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1f2d36;font-size:24px;font-weight:700}
      .small{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#435666;font-size:17px}
      .math{font-family:"Times New Roman","Noto Serif SC",serif;fill:#263d4a;font-size:23px;font-style:italic}
    </style>
  </defs>
  <rect width="1020" height="560" rx="18" class="bg"/>
  <text x="52" y="70" class="label">单模窗口：主模已开门，高次模还没开门</text>
  <rect x="70" y="120" width="880" height="310" rx="16" class="panel"/>

  <rect x="120" y="200" width="190" height="150" class="zone1"/>
  <rect x="310" y="200" width="310" height="150" class="zone2"/>
  <rect x="620" y="200" width="260" height="150" class="zone3"/>
  <line x1="120" y1="350" x2="890" y2="350" class="axis"/>
  <line x1="310" y1="166" x2="310" y2="368" class="cut"/>
  <line x1="620" y1="166" x2="620" y2="368" class="cut"/>
  <text x="278" y="156" class="math">fc,10</text>
  <text x="568" y="156" class="math">fc,next</text>
  <text x="884" y="382" class="math">f</text>

  <text x="164" y="246" class="label" font-size="20">截止区</text>
  <text x="348" y="246" class="label" font-size="20">单模区</text>
  <text x="672" y="246" class="label" font-size="20">多模区</text>
  <text x="146" y="290" class="small">TE10 也不能传</text>
  <text x="344" y="290" class="small">只传 TE10 主模</text>
  <text x="650" y="290" class="small">TE20 / TE01 等也可能传</text>

  <rect x="220" y="454" width="580" height="62" rx="14" fill="#fff" stroke="#d8e2e8" stroke-width="2"/>
  <text x="250" y="493" class="math">频率写法： fc,10 &lt; f &lt; fc,next</text>
  <text x="250" y="528" class="small">若用波长判断，注意不等式方向会反过来：λ0 越短频率越高。</text>
</svg>
