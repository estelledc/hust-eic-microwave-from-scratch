<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">长线与短线的判据</title>
  <desc id="desc">同一根线在低频时相位几乎不变，可以当短线；在微波频段线长与波长可比，沿线相位明显变化，必须当长线。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1769aa"/>
    </marker>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#fff8ed"/>
    </linearGradient>
    <style>
      .panel{fill:url(#panel);stroke:#d3dfeb;stroke-width:2}
      .axis{stroke:#36454f;stroke-width:3;stroke-linecap:round}
      .wire{stroke:#1769aa;stroke-width:8;stroke-linecap:round}
      .wave{fill:none;stroke:#e36b2c;stroke-width:4;stroke-linecap:round}
      .faint{fill:none;stroke:#9bb1c7;stroke-width:2;stroke-dasharray:7 8}
      .label{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1f2d36;font-size:24px;font-weight:700}
      .small{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#465a69;font-size:17px}
      .math{font-family:"Times New Roman","Noto Serif SC",serif;fill:#243746;font-size:24px;font-style:italic}
      .clock{fill:#fff;stroke:#607d8b;stroke-width:3}
      .hand{stroke:#e36b2c;stroke-width:4;stroke-linecap:round}
    </style>
  </defs>
  <rect x="24" y="24" width="912" height="412" rx="14" class="panel"/>
  <line x1="480" y1="56" x2="480" y2="408" stroke="#d3dfeb" stroke-width="2"/>

  <text x="72" y="78" class="label">低频：短线近似</text>
  <text x="552" y="78" class="label">微波：长线效应</text>

  <line x1="80" y1="210" x2="400" y2="210" class="wire" marker-end="url(#arrow)"/>
  <path d="M80 296 C160 250 320 250 400 296" class="wave"/>
  <line x1="80" y1="296" x2="400" y2="296" class="faint"/>
  <text x="120" y="340" class="small">一小段线只占很小的波长比例</text>
  <text x="146" y="376" class="math">l/λ ≪ 1</text>

  <circle cx="116" cy="150" r="32" class="clock"/>
  <circle cx="364" cy="150" r="32" class="clock"/>
  <line x1="116" y1="150" x2="116" y2="125" class="hand"/>
  <line x1="364" y1="150" x2="365" y2="125" class="hand"/>
  <text x="75" y="107" class="small">源端相位</text>
  <text x="324" y="107" class="small">负载相位</text>
  <text x="102" y="407" class="small">整条线几乎“同时”变化，可用集总参数近似。</text>

  <line x1="560" y1="210" x2="880" y2="210" class="wire" marker-end="url(#arrow)"/>
  <path d="M560 296 C600 250 640 342 680 296 C720 250 760 342 800 296 C840 250 860 270 880 296" class="wave"/>
  <line x1="560" y1="296" x2="880" y2="296" class="faint"/>
  <text x="594" y="340" class="small">同一根线已经跨过明显相位差</text>
  <text x="642" y="376" class="math">l/λ ≈ 1</text>

  <circle cx="596" cy="150" r="32" class="clock"/>
  <circle cx="844" cy="150" r="32" class="clock"/>
  <line x1="596" y1="150" x2="596" y2="125" class="hand"/>
  <line x1="844" y1="150" x2="866" y2="166" class="hand"/>
  <text x="556" y="107" class="small">源端相位</text>
  <text x="804" y="107" class="small">负载相位</text>
  <text x="562" y="407" class="small">必须把电压、电流写成位置函数 U(z), I(z)。</text>
</svg>
