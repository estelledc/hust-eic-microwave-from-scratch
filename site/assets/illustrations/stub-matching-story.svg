<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">并联单支节匹配的两步</title>
  <desc id="desc">主线长度 d 负责把导纳实部调到 g=1，支节长度 l 负责提供相反电纳抵消虚部。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1769aa"/>
    </marker>
    <style>
      .bg{fill:#fffdf7}
      .panel{fill:#fff;stroke:#d9e2e8;stroke-width:2}
      .line{stroke:#253641;stroke-width:6;stroke-linecap:round}
      .stub{stroke:#d86b22;stroke-width:7;stroke-linecap:round}
      .blue{stroke:#1769aa;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .green{stroke:#2f7d62;stroke-width:5;fill:none}
      .grid{stroke:#d3dde5;stroke-width:1.4;fill:none}
      .label{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1f2d36;font-size:24px;font-weight:700}
      .small{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#435666;font-size:17px}
      .math{font-family:"Times New Roman","Noto Serif SC",serif;fill:#253a4a;font-size:23px;font-style:italic}
      .dot{fill:#d86b22;stroke:#fff;stroke-width:3}
    </style>
  </defs>
  <rect width="1000" height="560" rx="18" class="bg"/>
  <text x="52" y="70" class="label">并联单支节匹配：主线调实部，支节清虚部</text>

  <rect x="50" y="108" width="900" height="170" rx="16" class="panel"/>
  <line x1="110" y1="190" x2="850" y2="190" class="line"/>
  <rect x="850" y="155" width="56" height="70" rx="8" fill="#f8eadb" stroke="#bc7b35" stroke-width="3"/>
  <text x="862" y="198" class="small">ZL</text>
  <line x1="520" y1="190" x2="520" y2="252" class="stub"/>
  <line x1="492" y1="252" x2="548" y2="252" class="stub"/>
  <path d="M840 132 C730 116 610 128 525 176" class="blue"/>
  <text x="590" y="122" class="small">沿主线从负载向源走 d</text>
  <text x="486" y="156" class="math">ȳ(d)=1+jb</text>
  <text x="480" y="274" class="small">短路支节长度 l</text>
  <text x="116" y="246" class="small">匹配后看进去：ȳtot = 1</text>

  <rect x="70" y="320" width="390" height="190" rx="16" class="panel"/>
  <text x="98" y="358" class="label" font-size="21">第一步：找接入点</text>
  <circle cx="250" cy="420" r="62" fill="#fff" stroke="#263641" stroke-width="2"/>
  <circle cx="250" cy="420" r="44" class="grid"/>
  <path d="M190 420 C228 358 304 358 310 420 C304 482 228 482 190 420" class="green"/>
  <path d="M214 466 A62 62 0 0 1 300 374" class="blue"/>
  <circle cx="214" cy="466" r="7" class="dot"/>
  <circle cx="300" cy="374" r="7" class="dot"/>
  <text x="320" y="383" class="small">g=1</text>
  <text x="98" y="492" class="math">主线负责：Re ȳ = 1</text>

  <rect x="540" y="320" width="390" height="190" rx="16" class="panel"/>
  <text x="568" y="358" class="label" font-size="21">第二步：支节抵消虚部</text>
  <text x="588" y="410" class="math">ȳline = 1 + jb</text>
  <text x="588" y="448" class="math">ȳstub = −jb</text>
  <line x1="585" y1="466" x2="840" y2="466" stroke="#c7d4de" stroke-width="2"/>
  <text x="588" y="498" class="math">ȳtot = 1</text>
  <text x="745" y="410" class="small">只补电纳</text>
  <text x="745" y="448" class="small">不改电导</text>
</svg>
