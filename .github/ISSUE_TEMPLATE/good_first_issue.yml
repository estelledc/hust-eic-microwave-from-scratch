name: Good First Issue 提案
description: 提议适合新手的入门任务（可给 Agent 用）
title: "[good first issue]: "
labels:
  - good first issue
  - help wanted
body:
  - type: markdown
    attributes:
      value: |
        维护者可将确认的任务写入 [docs/good-first-issues.md](https://github.com/estelledc/hust-eic-microwave-from-scratch/blob/main/docs/good-first-issues.md)。
        Agent 接手见 [docs/AGENTS.md](https://github.com/estelledc/hust-eic-microwave-from-scratch/blob/main/docs/AGENTS.md)。

  - type: textarea
    id: task
    attributes:
      label: 任务描述
      description: 一句话说明新手要做什么
    validations:
      required: true

  - type: dropdown
    id: difficulty
    attributes:
      label: 难度
      options:
        - ⭐ 入门
        - ⭐⭐ 简单
        - ⭐⭐⭐ 中等
    validations:
      required: true

  - type: input
    id: paths
    attributes:
      label: 涉及路径
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: 建议分支名
      placeholder: content/xxx 或 docs/xxx
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
    validations:
      required: true

  - type: textarea
    id: agent_prompt
    attributes:
      label: Agent prompt 示例（可选）
      description: 复制到 Cursor/Codex 即可开干
      render: markdown
    validations:
      required: false
