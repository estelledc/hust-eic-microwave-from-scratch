name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static site
        run: python build.py

      - name: Verify cross references
        run: python scripts/tools/check_cross_refs.py

      - name: Verify exam integration anchors
        run: python scripts/tools/check_exam_integration.py

      - name: Verify internal links
        run: python scripts/tools/check_internal_links.py

      - name: Verify public showcase contract
        run: python scripts/tools/audit_showcase.py

      - name: Run showcase unit tests
        run: python -m unittest discover -s tests

      - name: Python syntax check
        run: python -m py_compile build.py scripts/plots/*.py scripts/tools/*.py tests/*.py
