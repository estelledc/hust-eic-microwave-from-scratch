name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static site
        run: python build.py

      - name: Verify cross references
        run: python scripts/tools/check_cross_refs.py

      - name: Verify exam integration anchors
        run: python scripts/tools/check_exam_integration.py

      - name: Verify internal links
        run: python scripts/tools/check_internal_links.py

      - name: Python syntax check
        run: python -m py_compile build.py scripts/plots/*.py scripts/tools/*.py
