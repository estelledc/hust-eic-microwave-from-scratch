name: PDF Release

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition suffix for filenames (e.g. 2026.06)"
        required: false
        default: ""
      include_complete:
        description: "Also build the single-file complete volume"
        type: boolean
        default: false
  push:
    tags:
      - "pdf-v*"
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: pdf-release
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-pdf.txt
          playwright install chromium

      - name: Build static site
        run: python build.py

      - name: Build PDF volumes
        env:
          EDITION_INPUT: ${{ github.event.inputs.edition }}
          INCLUDE_COMPLETE: ${{ github.event.inputs.include_complete }}
        run: |
          if [ -n "$EDITION_INPUT" ]; then
            EDITION="$EDITION_INPUT"
          elif [[ "${{ github.ref_name }}" == pdf-v* ]]; then
            EDITION="${{ github.ref_name }}"
            EDITION="${EDITION#pdf-v}"
          else
            EDITION="$(date -u +%Y.%m)"
          fi
          ARGS=(--edition "$EDITION")
          if [ "$INCLUDE_COMPLETE" = "true" ]; then
            ARGS+=(--include-complete)
          fi
          python scripts/tools/build_pdf.py "${ARGS[@]}"

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: microwave-pdf-${{ github.run_number }}
          path: dist/pdf/
          retention-days: 90

      - name: Attach PDFs to GitHub Release (tag)
        if: startsWith(github.ref, 'refs/tags/pdf-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" dist/pdf/*.pdf --clobber

      - name: Attach PDFs to GitHub Release (published)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/pdf/*.pdf --clobber

      - name: Create release from tag when missing
        if: startsWith(github.ref, 'refs/tags/pdf-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          EDITION="${TAG#pdf-v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          sed "s/{{EDITION}}/${EDITION}/g" docs/PDF_RELEASE_NOTES_TEMPLATE.md > /tmp/release-notes.md
          gh release create "$TAG" dist/pdf/*.pdf \
            --title "离线 PDF · ${EDITION}" \
            --notes-file /tmp/release-notes.md
