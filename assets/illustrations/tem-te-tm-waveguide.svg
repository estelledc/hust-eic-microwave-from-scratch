<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title desc">
  <title id="title">TEM、TE、TM 三类波型</title>
  <desc id="desc">TEM 的 E_z 和 H_z 都为零，TE 的 E_z 为零但 H_z 不为零，TM 的 H_z 为零但 E_z 不为零。</desc>
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9 Z" fill="#1769aa"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L8 5 L1 9 Z" fill="#d86b22"/>
    </marker>
    <style>
      .bg{fill:#f8faf7}
      .panel{fill:#fff;stroke:#d8e2e7;stroke-width:2}
      .metal{fill:#edf1f3;stroke:#263641;stroke-width:4}
      .hole{fill:#fffdf8;stroke:#263641;stroke-width:3}
      .e{stroke:#d86b22;stroke-width:4;marker-end:url(#arrO);fill:none}
      .h{stroke:#1769aa;stroke-width:4;marker-end:url(#arrB);fill:none}
      .z{fill:#2f7d62;stroke:#fff;stroke-width:2}
      .label{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#1f2d36;font-size:24px;font-weight:700}
      .small{font-family:"Noto Sans SC","PingFang SC",Arial,sans-serif;fill:#435666;font-size:17px}
      .math{font-family:"Times New Roman","Noto Serif SC",serif;fill:#263d4a;font-size:23px;font-style:italic}
    </style>
  </defs>
  <rect width="1080" height="520" rx="18" class="bg"/>
  <text x="54" y="68" class="label">波型只看纵向分量：E<tspan baseline-shift="sub" font-size="15">z</tspan> 和 H<tspan baseline-shift="sub" font-size="15">z</tspan></text>

  <rect x="48" y="112" width="300" height="340" rx="16" class="panel"/>
  <text x="78" y="154" class="label">TEM</text>
  <circle cx="164" cy="280" r="82" class="metal"/>
  <circle cx="164" cy="280" r="28" fill="#fffdf8" stroke="#263641" stroke-width="4"/>
  <path d="M164 252 L164 210" class="e"/>
  <path d="M188 264 C226 250 236 304 194 314" class="h"/>
  <path d="M140 264 C102 250 92 304 134 314" class="h"/>
  <text x="222" y="224" class="small">双导体可有电压差</text>
  <text x="78" y="392" class="math">Ez = 0, Hz = 0</text>
  <text x="78" y="424" class="small">场完全横向，如同轴线</text>

  <rect x="390" y="112" width="300" height="340" rx="16" class="panel"/>
  <text x="420" y="154" class="label">TE</text>
  <rect x="452" y="212" width="176" height="122" rx="8" class="hole"/>
  <path d="M482 304 C520 240 562 240 600 304" class="e"/>
  <circle cx="540" cy="273" r="13" class="z"/>
  <text x="532" y="279" fill="#fff" font-family="Arial" font-size="18">H</text>
  <text x="420" y="392" class="math">Ez = 0, Hz ≠ 0</text>
  <text x="420" y="424" class="small">又叫 H 波，常先解 H<tspan baseline-shift="sub" font-size="12">z</tspan></text>

  <rect x="732" y="112" width="300" height="340" rx="16" class="panel"/>
  <text x="762" y="154" class="label">TM</text>
  <rect x="794" y="212" width="176" height="122" rx="8" class="hole"/>
  <path d="M820 278 L866 278" class="h"/>
  <path d="M944 278 L900 278" class="h"/>
  <circle cx="882" cy="273" r="13" fill="#d86b22" stroke="#fff" stroke-width="2"/>
  <text x="875" y="279" fill="#fff" font-family="Arial" font-size="18">E</text>
  <text x="762" y="392" class="math">Ez ≠ 0, Hz = 0</text>
  <text x="762" y="424" class="small">又叫 E 波，常先解 E<tspan baseline-shift="sub" font-size="12">z</tspan></text>
</svg>
